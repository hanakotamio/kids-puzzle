*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fbf7ec,#edf8f7 55%,#fbf1f5)}button,select,input{font:inherit}.app{display:grid;grid-template-columns:18.5rem minmax(0,1fr);gap:.8rem;width:min(100rem,calc(100vw - 1rem));margin:0 auto;padding:.5rem}.side{display:flex;flex-direction:column;gap:.6rem;min-width:0}.brand,.panel,.topbar{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:8px;box-shadow:0 8px 22px rgba(35,45,48,.09)}.brand,.panel{padding:.75rem}h1{font-size:1.45rem;margin:0 0 .25rem;letter-spacing:0}.muted,.meta,.tip{color:var(--muted);font-size:.88rem;line-height:1.45}.label{display:block;font-weight:800;font-size:.82rem;margin:0 0 .35rem}.search,select{width:100%;min-height:2.35rem;border:1px solid #d6dde0;border-radius:7px;background:#fff;padding:0 .6rem}.gallery-tools{display:grid;gap:.4rem;margin-bottom:.45rem}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;max-height:29rem;overflow:auto;padding-right:.1rem}.art-card{padding:.3rem;border:2px solid transparent;border-radius:8px;background:#fff;cursor:pointer;text-align:left;box-shadow:0 4px 12px rgba(34,48,52,.1)}.art-card[aria-pressed=true]{border-color:var(--accent)}.thumb{width:100%;aspect-ratio:4/3;border-radius:6px;background-size:cover;background-position:center;border:1px solid #e0e6e7}.art-card span{display:block;padding:.3rem .1rem 0;font-size:.74rem;font-weight:800;line-height:1.25}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}.btn{min-height:2.35rem;border:1px solid #c9d4d7;border-radius:7px;background:#fff;cursor:pointer;font-weight:800}.btn.primary{background:var(--accent);border-color:#dc4058;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.55rem}.stat{padding:.42rem .25rem;border:1px solid #e2e7e8;border-radius:7px;background:#fbfdfd;text-align:center}.stat b{display:block;font-size:1rem}.stat small{font-size:.68rem;color:var(--muted)}.main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.55rem;min-width:0}.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.65rem .8rem}.zoom-controls{display:flex;align-items:center;gap:.35rem;white-space:nowrap}.zoom-btn{width:2.15rem;min-height:2.15rem;border:1px solid #c9d4d7;border-radius:7px;background:#fff;cursor:pointer;font-weight:900}.zoom-label{min-width:3.2rem;text-align:center;font-weight:800;color:var(--muted);font-size:.86rem}.topline{display:flex;justify-content:space-between;gap:.7rem;margin-bottom:.4rem}.progress{height:.55rem;border-radius:99px;background:#e7ded1;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f3b34c,#2c9b99)}.table{position:relative;height:calc(100vh - 6.2rem);min-height:40rem;border-radius:8px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.42),transparent 21rem),linear-gradient(120deg,#f2e8d6,var(--table));border:1px solid #d7c8ad;box-shadow:var(--shadow);overflow:hidden;touch-action:none}.board{position:absolute;left:50%;top:50%;width:min(44vw,34rem);aspect-ratio:4/3;transform:translate(-50%,-50%);border:0;outline:4px solid #fffaf0;box-shadow:0 12px 28px rgba(55,42,25,.23);background:#ddd1bd;z-index:2;overflow:hidden}.ghost{position:absolute;inset:0;background-image:var(--art-url);background-size:100% 100%;opacity:.34}.grid{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.34) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.34) 1px,transparent 1px);background-size:var(--cell-w) var(--cell-h);pointer-events:none}.piece{position:absolute;border:0;background:transparent;padding:0;filter:drop-shadow(0 5px 5px rgba(29,24,18,.28));cursor:grab;touch-action:none;user-select:none;z-index:5}.piece svg{display:block;width:100%;height:100%;overflow:visible}.piece.dragging{z-index:80;cursor:grabbing;filter:drop-shadow(0 14px 12px rgba(29,24,18,.36));transform:scale(1.08) rotate(0deg)!important}.piece.placed{filter:none;cursor:default;z-index:3;transform:none!important}.piece.flash{outline:4px solid #ffd45a;outline-offset:2px}.complete{position:fixed;right:1rem;bottom:1rem;max-width:min(24rem,calc(100vw - 2rem));background:#fff;border:1px solid #f4c5cb;border-radius:8px;padding:1rem;box-shadow:var(--shadow);transform:translateY(130%);transition:.25s;z-index:100}.complete.show{transform:translateY(0)}@media(max-width:62rem){.app{grid-template-columns:1fr}.gallery{max-height:16rem}.topbar{grid-template-columns:1fr}.zoom-controls{justify-content:flex-end}.table{height:78vh;min-height:38rem}.board{width:min(62vw,28rem)}}

<div class="app"><aside class="side"><section class="brand"><h1>好奇心ジグソーパズル</h1><p class="muted">50枚すべて高画質生成画像です。丸いジグソーピースを中央の盤面へドラッグしてはめます。</p></section><section class="panel"><label class="label" for="search">絵を選ぶ</label><div class="gallery-tools"><input class="search" id="search" type="search" placeholder="宇宙、森、海、景色など"><select id="category"><option value="all">すべての絵柄</option><option value="cute">かわいい</option><option value="discovery">発見いっぱい</option><option value="photo">写真風の景色</option></select></div><div class="gallery" id="gallery"></div></section><section class="panel"><label class="label" for="level">レベル</label><select id="level"><option value="100">100ピース はじめて</option><option value="250">250ピース じっくり</option><option value="500">500ピース かなり難しい</option><option value="750">750ピース 名人</option><option value="1000">1000ピース 博士</option></select><div class="actions" style="margin-top:.55rem"><button class="btn primary" id="newGame" type="button">はじめる</button><button class="btn" id="hint" type="button">ヒント</button><button class="btn" id="scatter" type="button">散らす</button></div><div class="stats"><div class="stat"><b id="placed">0</b><small>完成</small></div><div class="stat"><b id="total">100</b><small>ピース</small></div><div class="stat"><b id="percent">0%</b><small>進み</small></div></div></section></aside><main class="main"><section class="topbar"><div><div class="topline"><strong id="artName"></strong><span class="meta" id="gridInfo"></span></div><div class="progress"><div id="bar"></div></div></div><p class="tip" id="tip"></p><div class="zoom-controls" aria-label="画面ズーム"><button class="zoom-btn" id="zoomOut" type="button" title="小さくする">−</button><span class="zoom-label" id="zoomLabel">100%</span><button class="zoom-btn" id="zoomIn" type="button" title="大きくする">＋</button></div></section><section class="table" id="table"><div class="board" id="board"><div class="ghost"></div><div class="grid"></div></div></section></main></div><div class="complete" id="complete"><strong>完成です！</strong><p class="muted">絵の中の小さな発見まで、よく見つけました。</p></div>
<script>
const names = [["宇宙列車の旅","cute","space"],["森の発明工房","discovery","forest"],["海の研究ラボ","discovery","sea"],["山と湖の絶景","photo","mountain"],["お菓子の町","cute","candy"],["恐竜の谷","discovery","dino"],["夜の天文台","discovery","space"],["雪国の村","photo","snow"],["花火の港","photo","harbor"],["雲の上の飛行船","cute","sky"],["サンゴの迷路","discovery","sea"],["虹の牧場","cute","farm"],["ロボット博物館","discovery","robot"],["秋の渓谷","photo","valley"],["星空キャンプ","photo","camp"],["キッチン探検隊","cute","kitchen"],["宝石鉱山","discovery","cave"],["熱帯雨林の橋","photo","jungle"],["月面基地","discovery","moon"],["ひまわり列車","cute","train"],["氷の城","cute","ice"],["火山島の夕焼け","photo","volcano"],["昆虫の庭","discovery","garden"],["時計塔の広場","discovery","town"],["ペンギン郵便局","cute","snow"],["灯台と荒波","photo","lighthouse"],["フルーツ市場","cute","market"],["化石研究室","discovery","fossil"],["湖畔の紅葉","photo","lake"],["秘密の図書館","discovery","library"],["空飛ぶ学校","cute","school"],["竹林の小道","photo","bamboo"],["深海の潜水艇","discovery","sea"],["銀河の遊園地","cute","space"],["砂漠のオアシス","photo","desert"],["ミニ消防隊","cute","city"],["結晶の洞窟","discovery","crystal"],["北欧のオーロラ","photo","aurora"],["忍者からくり屋敷","discovery","house"],["風車と花畑","photo","field"],["くまのパン屋さん","cute","bakery"],["水車の村","photo","village"],["からくり船","discovery","ship"],["春の川くだり","cute","river"],["古代遺跡の朝","photo","ruins"],["雲海の山道","photo","clouds"],["宇宙水族館","cute","aquarium"],["発明家の机","discovery","desk"],["夕暮れの棚田","photo","terrace"],["魔法の温室","cute","greenhouse"]];
const tips={cute:'大きな色のかたまりと、まるい形から探してみましょう。',discovery:'小さな道具や生き物を見つけながら組むと楽しく進みます。',photo:'空、山、水、手前の細かい模様に分けると進めやすいです。'};
const levels={100:[10,10,100],250:[20,13,250],500:[25,20,500],750:[30,25,750],1000:[40,25,1000]};
const art=names.map((e,i)=>({name:e[0],category:e[1],theme:e[2],hint:tips[e[1]],image:'assets/jigsaw-'+String(i+1).padStart(2,'0')+'.jpg',thumb:'assets/thumbs/jigsaw-'+String(i+1).padStart(2,'0')+'.jpg'}));
const table=document.getElementById('table'),board=document.getElementById('board'),gallery=document.getElementById('gallery'),level=document.getElementById('level'),category=document.getElementById('category'),search=document.getElementById('search'),placedEl=document.getElementById('placed'),totalEl=document.getElementById('total'),percentEl=document.getElementById('percent'),bar=document.getElementById('bar'),complete=document.getElementById('complete'),artName=document.getElementById('artName'),gridInfo=document.getElementById('gridInfo'),tip=document.getElementById('tip'),zoomIn=document.getElementById('zoomIn'),zoomOut=document.getElementById('zoomOut'),zoomLabel=document.getElementById('zoomLabel');
let selectedArt=0,total=100,placed=0,active=null,z=10,gameRun=0,edgeMap=null,zoomLevel=1;
function imgUrl(item){return item.image}
function cssImg(item){return 'url("'+item.image+'")'}
function gridLevel(){return levels[Number(level.value)]}
function buildGallery(){const q=search.value.trim().toLowerCase();gallery.innerHTML='';art.map((item,index)=>({item,index})).filter(x=>(category.value==='all'||x.item.category===category.value)&&(!q||x.item.name.toLowerCase().includes(q)||x.item.theme.includes(q))).forEach(({item,index})=>{const b=document.createElement('button');b.className='art-card';b.type='button';b.setAttribute('aria-pressed',String(index===selectedArt));b.innerHTML='<div class="thumb"></div><span>'+(index+1)+'. '+item.name+'</span>';b.querySelector('.thumb').style.backgroundImage='url("'+item.thumb+'")';b.onclick=()=>{selectedArt=index;buildGallery();startGame()};gallery.appendChild(b)})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CURVE=[0,0,35,15,37,5,37,5,40,0,38,-5,38,-5,20,-20,50,-20,50,-20,80,-20,62,-5,62,-5,60,0,63,5,63,5,65,15,100,0];
function jigEdgeD(ax,ay,bx,by,sign){
  if(sign===0)return 'L '+bx+' '+by+' ';
  const dx=bx-ax,dy=by-ay;
  const pt=(t,n)=>[ax+dx*t/100-dy*n/100*sign,ay+dy*t/100+dx*n/100*sign];
  let d='';
  for(let i=0;i<CURVE.length;i+=6){
    const c1=pt(CURVE[i],CURVE[i+1]);
    const c2=pt(CURVE[i+2],CURVE[i+3]);
    const e=pt(CURVE[i+4],CURVE[i+5]);
    d+='C '+c1[0]+' '+c1[1]+' '+c2[0]+' '+c2[1]+' '+e[0]+' '+e[1]+' ';
  }
  return d;
}
function makeEdgeMap(cols,rows){
  const hEdge=[],vEdge=[];
  for(let r=0;r<=rows;r++){
    hEdge[r]=[];
    for(let c=0;c<cols;c++) hEdge[r][c]=Math.random()<.5?1:-1;
  }
  for(let r=0;r<rows;r++){
    vEdge[r]=[];
    for(let c=0;c<=cols;c++) vEdge[r][c]=Math.random()<.5?1:-1;
  }
  return{hEdge,vEdge};
}
function edgesFor(col,row,cols,rows){
  return{
    top:row===0?0:edgeMap.hEdge[row][col],
    right:col===cols-1?0:edgeMap.vEdge[row][col+1],
    bottom:row===rows-1?0:-edgeMap.hEdge[row+1][col],
    left:col===0?0:-edgeMap.vEdge[row][col]
  };
}
function topSeg(s,w,t){
  if(!s)return 'L '+(t+w)+' '+t+' ';
  const y=t,cx=t+w/2;
  const shoulder=w*.205, neck=w*.092, cap=w*.128, depth=t*.72;
  const dir=s>0?-1:1;
  const yNeck=y+dir*depth*.42, yCap=y+dir*depth;
  return 'L '+(cx-shoulder)+' '+y+
    ' C '+(cx-shoulder*.78)+' '+y+' '+(cx-neck*1.15)+' '+yNeck+' '+(cx-neck)+' '+yNeck+
    ' C '+(cx-neck)+' '+(yCap-dir*cap*.78)+' '+(cx+neck)+' '+(yCap-dir*cap*.78)+' '+(cx+neck)+' '+yNeck+
    ' C '+(cx+neck*1.15)+' '+yNeck+' '+(cx+shoulder*.78)+' '+y+' '+(cx+shoulder)+' '+y+
    ' L '+(t+w)+' '+y+' ';
}
function rightSeg(s,w,h,t){
  if(!s)return 'L '+(t+w)+' '+(t+h)+' ';
  const x=t+w,cy=t+h/2;
  const shoulder=h*.205, neck=h*.092, cap=h*.128, depth=t*.72;
  const dir=s>0?1:-1;
  const xNeck=x+dir*depth*.42, xCap=x+dir*depth;
  return 'L '+x+' '+(cy-shoulder)+
    ' C '+x+' '+(cy-shoulder*.78)+' '+xNeck+' '+(cy-neck*1.15)+' '+xNeck+' '+(cy-neck)+
    ' C '+(xCap+dir*cap*.78)+' '+(cy-neck)+' '+(xCap+dir*cap*.78)+' '+(cy+neck)+' '+xNeck+' '+(cy+neck)+
    ' C '+xNeck+' '+(cy+neck*1.15)+' '+x+' '+(cy+shoulder*.78)+' '+x+' '+(cy+shoulder)+
    ' L '+x+' '+(t+h)+' ';
}
function bottomSeg(s,w,h,t){
  if(!s)return 'L '+t+' '+(t+h)+' ';
  const y=t+h,cx=t+w/2;
  const shoulder=w*.205, neck=w*.092, cap=w*.128, depth=t*.72;
  const dir=s>0?1:-1;
  const yNeck=y+dir*depth*.42, yCap=y+dir*depth;
  return 'L '+(cx+shoulder)+' '+y+
    ' C '+(cx+shoulder*.78)+' '+y+' '+(cx+neck*1.15)+' '+yNeck+' '+(cx+neck)+' '+yNeck+
    ' C '+(cx+neck)+' '+(yCap+dir*cap*.78)+' '+(cx-neck)+' '+(yCap+dir*cap*.78)+' '+(cx-neck)+' '+yNeck+
    ' C '+(cx-neck*1.15)+' '+yNeck+' '+(cx-shoulder*.78)+' '+y+' '+(cx-shoulder)+' '+y+
    ' L '+t+' '+y+' ';
}
function leftSeg(s,w,h,t){
  if(!s)return 'L '+t+' '+t+' ';
  const x=t,cy=t+h/2;
  const shoulder=h*.205, neck=h*.092, cap=h*.128, depth=t*.72;
  const dir=s>0?-1:1;
  const xNeck=x+dir*depth*.42, xCap=x+dir*depth;
  return 'L '+x+' '+(cy+shoulder)+
    ' C '+x+' '+(cy+shoulder*.78)+' '+xNeck+' '+(cy+neck*1.15)+' '+xNeck+' '+(cy+neck)+
    ' C '+(xCap-dir*cap*.78)+' '+(cy+neck)+' '+(xCap-dir*cap*.78)+' '+(cy-neck)+' '+xNeck+' '+(cy-neck)+
    ' C '+xNeck+' '+(cy-neck*1.15)+' '+x+' '+(cy-shoulder*.78)+' '+x+' '+(cy-shoulder)+
    ' L '+x+' '+t+' ';
}
function piecePath(w,h,pad,e){
  const L=pad,T=pad,R=pad+w,B=pad+h;
  return 'M '+L+' '+T+' '+
    jigEdgeD(L,T,R,T,e.top)+
    jigEdgeD(R,T,R,B,e.right)+
    jigEdgeD(R,B,L,B,e.bottom)+
    jigEdgeD(L,B,L,T,e.left)+
    'Z';
}
function makePieceSvg(col,row,cols,rows,coreW,coreH,tab,boardW,boardH){const e=edgesFor(col,row,cols,rows);const path=piecePath(coreW,coreH,tab,e);const id='clip-'+gameRun+'-'+col+'-'+row+'-'+Math.random().toString(36).slice(2);const width=coreW+tab*2,height=coreH+tab*2;const imgX=tab-col*coreW,imgY=tab-row*coreH;return '<svg viewBox="0 0 '+width+' '+height+'" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+path+'"></path></clipPath></defs><image href="'+imgUrl(art[selectedArt])+'" x="'+imgX+'" y="'+imgY+'" width="'+boardW+'" height="'+boardH+'" preserveAspectRatio="none" clip-path="url(#'+id+')"></image><path d="'+path+'" fill="none" stroke="rgba(75,72,62,.58)" stroke-width="1.05"></path><path d="'+path+'" fill="none" stroke="rgba(255,255,255,.42)" stroke-width=".55" transform="translate(.7 .7)"></path></svg>'}
function setPieceSvg(p,col,row,cols,rows,coreW,coreH,tab,boardW,boardH){p.style.width=(coreW+tab*2)+'px';p.style.height=(coreH+tab*2)+'px';p.innerHTML=makePieceSvg(col,row,cols,rows,coreW,coreH,tab,boardW,boardH)}
function freePieceScale(count){return count<=100?1.08:count<=250?1.02:count<=500?.96:count<=750?.9:.84}
function overlap(a,b,pad){return !(a.x+a.w<b.x-pad||a.x>b.x+b.w+pad||a.y+a.h<b.y-pad||a.y>b.y+b.h+pad)}
function randomSpot(t,boardBox,pw,ph){const gap=Math.max(16,pw*.35);const zones=[{x:12,y:12,w:t.width-24,h:boardBox.y-gap-ph},{x:12,y:boardBox.y+boardBox.h+gap,w:t.width-24,h:t.height-(boardBox.y+boardBox.h+gap)-ph-12},{x:12,y:Math.max(12,boardBox.y-gap),w:boardBox.x-gap-pw,h:boardBox.h+gap*2},{x:boardBox.x+boardBox.w+gap,y:Math.max(12,boardBox.y-gap),w:t.width-(boardBox.x+boardBox.w+gap)-pw-12,h:boardBox.h+gap*2}].filter(z=>z.w>8&&z.h>8);if(!zones.length)return{x:14+Math.random()*Math.max(1,t.width-pw-28),y:14+Math.random()*Math.max(1,t.height-ph-28)};const area=zones.reduce((s,z)=>s+z.w*z.h,0);let pick=Math.random()*area,zone=zones[0];for(const z of zones){pick-=z.w*z.h;if(pick<=0){zone=z;break}}return{x:zone.x+Math.random()*zone.w,y:zone.y+Math.random()*zone.h}}
function fitBoardToZoom(){
  const rect=table.getBoundingClientRect();
  const mobile=window.matchMedia('(max-width:62rem)').matches;
  const base=Math.min(rect.width*(mobile ? .62 : .44), mobile?448:544);
  const maxByHeight=(rect.height-36)*4/3;
  const width=Math.max(240, Math.min(base*zoomLevel, rect.width-28, maxByHeight));
  board.style.width=width+'px';
  zoomLabel.textContent=Math.round(zoomLevel*100)+'%';
}
function setZoom(next){
  const before=Array.from(table.querySelectorAll('.piece:not(.placed)')).map(p=>({p,x:(p.offsetLeft+p.offsetWidth/2)/Math.max(1,table.clientWidth),y:(p.offsetTop+p.offsetHeight/2)/Math.max(1,table.clientHeight)}));
  zoomLevel=Math.max(.65,Math.min(2.6,next));
  fitBoardToZoom();
  relayoutPieces(before);
}
function relayoutPieces(floating=[]){const [cols,rows,count]=gridLevel(),br=board.getBoundingClientRect(),tw=table.clientWidth,th=table.clientHeight,baseW=br.width/cols,baseH=br.height/rows;const placedTab=Math.max(6,Math.max(baseW,baseH)*.22),scale=freePieceScale(count),coreW=baseW*scale,coreH=baseH*scale,freeTab=Math.max(6,Math.max(coreW,coreH)*.22),saved=new Map(floating.map(x=>[x.p,x]));table.querySelectorAll('.piece').forEach(p=>{const col=Number(p.dataset.col),row=Number(p.dataset.row);if(p.dataset.placed==='true'){setPieceSvg(p,col,row,cols,rows,baseW,baseH,placedTab,br.width,br.height);p.style.left=(col*baseW-placedTab)+'px';p.style.top=(row*baseH-placedTab)+'px';p.style.transform='none';return}setPieceSvg(p,col,row,cols,rows,coreW,coreH,freeTab,cols*coreW,rows*coreH);const s=saved.get(p),x=s?s.x*tw:p.offsetLeft,y=s?s.y*th:p.offsetTop;p.style.left=Math.max(6,Math.min(tw-p.offsetWidth-6,x-p.offsetWidth/2))+'px';p.style.top=Math.max(6,Math.min(th-p.offsetHeight-6,y-p.offsetHeight/2))+'px';p.style.transform='rotate('+(p.dataset.angle||0)+'deg)'})}
function startGame(){fitBoardToZoom();const run=++gameRun;const [cols,rows,count]=gridLevel();total=count;placed=0;z=10;active=null;edgeMap=makeEdgeMap(cols,rows);complete.classList.remove('show');table.querySelectorAll('.piece').forEach(p=>p.remove());board.querySelectorAll('.piece').forEach(p=>p.remove());const item=art[selectedArt];const url=cssImg(item);table.style.setProperty('--art-url',url);board.style.setProperty('--art-url',url);board.style.setProperty('--cell-w',100/cols+'%');board.style.setProperty('--cell-h',100/rows+'%');artName.textContent=item.name;tip.textContent=item.hint;gridInfo.textContent=cols+' × '+rows;updateStats();requestAnimationFrame(()=>scatterPieces(cols,rows,count,run));setTimeout(()=>{if(run===gameRun&&table.querySelectorAll('.piece').length===0)scatterPieces(cols,rows,count,run)},250)}
function scatterPieces(cols,rows,count,run){if(run!==gameRun)return;table.querySelectorAll('.piece').forEach(p=>p.remove());const t=table.getBoundingClientRect(),b=board.getBoundingClientRect();const boardBox={x:b.left-t.left,y:b.top-t.top,w:b.width,h:b.height};const baseW=b.width/cols,baseH=b.height/rows;const scale=freePieceScale(count);const coreW=baseW*scale,coreH=baseH*scale,tab=Math.max(6,Math.max(coreW,coreH)*.22);const pieces=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(pieces.length<count)pieces.push({row:r,col:c});shuffle(pieces).forEach(d=>{const p=document.createElement('button');p.type='button';p.className='piece';p.dataset.col=d.col;p.dataset.row=d.row;p.dataset.placed='false';p.dataset.angle=(Math.random()*28-14).toFixed(1);setPieceSvg(p,d.col,d.row,cols,rows,coreW,coreH,tab,cols*coreW,rows*coreH);const spot=randomSpot(t,boardBox,coreW+tab*2,coreH+tab*2);p.style.left=spot.x+'px';p.style.top=spot.y+'px';p.style.transform='rotate('+p.dataset.angle+'deg)';p.addEventListener('pointerdown',beginDrag);p.addEventListener('dblclick',()=>place(p));table.appendChild(p)})}
function beginDrag(e){const p=e.currentTarget;if(p.dataset.placed==='true')return;e.preventDefault();const r=p.getBoundingClientRect();active={p,dx:e.clientX-r.left,dy:e.clientY-r.top};p.classList.add('dragging');p.style.zIndex=++z;window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true})}
function moveDrag(e){if(!active)return;const tr=table.getBoundingClientRect();active.p.style.left=e.clientX-tr.left-active.dx+'px';active.p.style.top=e.clientY-tr.top-active.dy+'px'}
function endDrag(){if(!active)return;const p=active.p;p.classList.remove('dragging');const tr=table.getBoundingClientRect(),br=board.getBoundingClientRect();const [cols,rows]=gridLevel(),col=Number(p.dataset.col),row=Number(p.dataset.row);const baseW=br.width/cols,baseH=br.height/rows,tab=Math.max(6,Math.max(baseW,baseH)*.22);const targetX=br.left-tr.left+col*baseW-tab,targetY=br.top-tr.top+row*baseH-tab;const pr=p.getBoundingClientRect();const currentX=pr.left-tr.left,currentY=pr.top-tr.top;const snap=Math.max(18,Math.min(baseW,baseH)*1.35);if(Math.hypot(currentX-targetX,currentY-targetY)<=snap)place(p);active=null;window.removeEventListener('pointermove',moveDrag)}
function place(p){if(p.dataset.placed==='true')return;const [cols,rows]=gridLevel(),col=Number(p.dataset.col),row=Number(p.dataset.row),br=board.getBoundingClientRect();const baseW=br.width/cols,baseH=br.height/rows,tab=Math.max(6,Math.max(baseW,baseH)*.22);p.dataset.placed='true';p.classList.add('placed');setPieceSvg(p,col,row,cols,rows,baseW,baseH,tab,br.width,br.height);p.style.left=(col*baseW-tab)+'px';p.style.top=(row*baseH-tab)+'px';p.style.transform='none';board.appendChild(p);placed++;updateStats();if(placed===total)complete.classList.add('show')}
function updateStats(){const pct=Math.round(placed/total*100);placedEl.textContent=placed;totalEl.textContent=total;percentEl.textContent=pct+'%';bar.style.width=pct+'%'}
function revealHint(){Array.from(table.querySelectorAll('.piece:not(.placed)')).slice(0,8).forEach((p,i)=>setTimeout(()=>{p.classList.add('flash');setTimeout(()=>p.classList.remove('flash'),900)},i*80))}
function scatterLoosePieces(){const loose=Array.from(table.querySelectorAll('.piece:not(.placed)'));if(!loose.length)return;const t=table.getBoundingClientRect(),b=board.getBoundingClientRect(),boardBox={x:b.left-t.left,y:b.top-t.top,w:b.width,h:b.height};shuffle(loose).forEach((p,i)=>{const spot=randomSpot(t,boardBox,p.offsetWidth,p.offsetHeight);p.style.left=spot.x+'px';p.style.top=spot.y+'px';p.style.zIndex=++z;p.dataset.angle=(Math.random()*28-14).toFixed(1);p.style.transform='rotate('+p.dataset.angle+'deg)';setTimeout(()=>{p.classList.add('flash');setTimeout(()=>p.classList.remove('flash'),420)},Math.min(i,24)*18)})}
document.getElementById('newGame').onclick=startGame;document.getElementById('hint').onclick=revealHint;document.getElementById('scatter').onclick=scatterLoosePieces;zoomIn.onclick=()=>setZoom(zoomLevel+.15);zoomOut.onclick=()=>setZoom(zoomLevel-.15);level.onchange=startGame;category.onchange=buildGallery;search.oninput=buildGallery;window.addEventListener('resize',()=>startGame());buildGallery();startGame();
</script>
